[project]
name = "interviewos"
version = "0.1.0"
description = "Candidate-side recruiting service for ContextCon Build"
requires-python = ">=3.12"
dependencies = [
  "composio>=0.8",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
  "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["interviewos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
